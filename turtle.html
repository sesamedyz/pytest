<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 知识测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .header p {
      margin-top: 8px;
      font-size: 1rem;
      opacity: .85;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      margin-bottom: 20px;
    }

    /* 进度条 */
    .progress-wrap {
      margin-bottom: 28px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      color: #666;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 4px;
      transition: width .4s ease;
    }

    /* 题目 */
    .question-block {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px dashed #e9ecef;
    }
    .question-block:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .question-title {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      line-height: 1.7;
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
    }
    .q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      min-width: 28px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-radius: 8px;
      font-size: .82rem;
      font-weight: 700;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s;
      font-size: .95rem;
      color: #444;
    }
    .option-label:hover {
      border-color: #667eea;
      background: #f5f4ff;
    }
    .option-label input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 答题后状态 */
    .option-label.wrong {
      border-color: #dc3545;
      background: #fff5f5;
      color: #721c24;
    }
    .option-label.correct-hint {
      border-color: #28a745;
      background: #f0fff4;
      color: #155724;
    }

    .answer-hint {
      margin-top: 10px;
      font-size: .88rem;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }
    .answer-hint.show { display: block; }
    .answer-hint.ok { background: #d4edda; color: #155724; }
    .answer-hint.err { background: #f8d7da; color: #721c24; }

    .explanation {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,.15);
      font-size: .85rem;
      line-height: 1.6;
      color: inherit;
      opacity: .85;
    }

    /* 查看错题答案按钮 */
    .btn-answer {
      display: block;
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #dc3545;
      font-size: 1rem;
      font-weight: 700;
      border: 2px solid #dc3545;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background .2s, color .2s;
      margin-top: 10px;
    }
    .btn-answer:hover { background: #dc3545; color: #fff; }
    .btn-answer.hidden { display: none; }

    /* 查看全部题目已隐藏 */
    .review-question-hidden {
      display: none;
    }
    .review-question-hidden.show {
      display: block;
    }

    .btn-all {
      display: block;
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #667eea;
      font-size: 1rem;
      font-weight: 700;
      border: 2px solid #667eea;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background .2s, color .2s;
      margin-top: 12px;
    }
    .btn-all:hover { background: #667eea; color: #fff; }
    .btn-all.hidden { display: none; }

    /* 按钮 */
    .btn-submit {
      display: block;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: opacity .2s, transform .1s;
      margin-top: 10px;
    }
    .btn-submit:hover { opacity: .92; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* 成绩页 */
    #result-section { display: none; }

    .score-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: conic-gradient(#667eea var(--pct, 0%), #e9ecef var(--pct, 0%));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .score-circle::after {
      content: '';
      width: 110px;
      height: 110px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
    }
    .score-text {
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .score-number {
      font-size: 2.2rem;
      font-weight: 800;
      color: #667eea;
    }
    .score-label { font-size: .8rem; color: #888; }

    .result-summary {
      text-align: center;
      margin-bottom: 24px;
    }
    .result-summary h2 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 8px;
    }
    .result-summary p {
      color: #666;
      font-size: .95rem;
    }

    .stat-row {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 28px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .stat-num.green { color: #28a745; }
    .stat-num.red { color: #dc3545; }
    .stat-label { font-size: .82rem; color: #888; }

    .btn-retry {
      display: block;
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #667eea;
      font-size: 1rem;
      font-weight: 700;
      border: 2px solid #667eea;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background .2s, color .2s;
    }
    .btn-retry:hover { background: #667eea; color: #fff; }

    /* 行内代码 */
    code {
      font-family: "Consolas", "Courier New", monospace;
      background: #f0f0f0;
      color: #c0392b;
      border-radius: 5px;
      padding: 2px 7px;
      font-size: .92em;
      border: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    /* 块级代码 */
    pre {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #667eea;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: .92em;
      color: #333;
      margin: 10px 0 14px;
      overflow-x: auto;
      line-height: 1.7;
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
      font-size: 1em;
    }

    /* 警告 */
    .warn {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: .9rem;
      display: none;
    }
    .warn.show { display: block; }

    @media (max-width: 480px) {
      .card { padding: 20px; }
      .header h1 { font-size: 1.5rem; }
      .stat-row { gap: 16px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🐍 Python 知识测试</h1>
    <p>共 20 题 · 单选题 · 答完后点击提交查看成绩</p>
  </div>

  <!-- 答题区 -->
  <div id="quiz-section">
    <div class="card">
      <!-- 进度 -->
      <div class="progress-wrap">
        <div class="progress-info">
          <span>答题进度</span>
          <span id="progress-text">0 / 20</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- 警告 -->
      <div class="warn" id="warn-msg">⚠️ 请完成所有题目再提交！</div>

      <div id="questions-container"></div>

      <button class="btn-submit" id="btn-submit" onclick="submitQuiz()">提 交 答 卷</button>
    </div>
  </div>

  <!-- 成绩区 -->
  <div id="result-section">
    <div class="card">
      <div class="result-summary">
        <h2 id="result-title">🎉 答题完成！</h2>
        <p id="result-desc"></p>
      </div>
      <div class="score-circle" id="score-circle">
        <div class="score-text">
          <div class="score-number" id="score-number">0</div>
          <div class="score-label">分</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-num green" id="stat-correct">0</div>
          <div class="stat-label">答对</div>
        </div>
        <div class="stat-item">
          <div class="stat-num red" id="stat-wrong">0</div>
          <div class="stat-label">答错</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" style="color:#667eea" id="stat-total">20</div>
          <div class="stat-label">总题数</div>
        </div>
      </div>
      <button class="btn-retry" onclick="retryQuiz()">🔄 重新答题</button>
    </div>

    <!-- 答题详情 -->
    <div class="card" id="review-card">
      <h3 style="margin-bottom:20px;color:#333">📋 答题详情</h3>
      <div id="review-container"></div>
      <button class="btn-answer hidden" id="btn-show-answers" onclick="showWrongAnswers()">🔍 查看错题答案</button>
      <button class="btn-all hidden" id="btn-show-all" onclick="showAllAnswers()">📖 查看全部答案</button>
    </div>
  </div>
</div>

<script>
// ==================== 题目数据 ====================
const questions = [
  {
    id: 1,
    text: "python中使用以下哪种符号注释代码",
    options: ["A. <code>#</code>", "B. <code>//</code>", "C. <code>%</code>", "D. <code>**</code>"],
    answer: "A",
    explanation: "Python 使用 <code>#</code> 进行单行注释。<code>//</code> 是 JavaScript/C++ 的注释符，<code>%</code> 是取余运算符，<code>**</code> 是幂运算符。"
  },
  {
    id: 2,
    text: "python中的输入方式是",
    options: ["A. <code>put()</code> 方法", "B. <code>python()</code> 方法", "C. <code>input()</code> 方法", "D. <code>turtle()</code> 方法"],
    answer: "C",
    explanation: "Python 使用内置函数 <code>input()</code> 接收用户输入，返回字符串类型。"
  },
  {
    id: 3,
    text: '执行下列代码，打印出的内容是<pre><code>print("*" * 5)</code></pre>',
    options: ['A. *', 'B. *5', 'C. "*" * 5', 'D. *****'],
    answer: "D",
    explanation: "字符串与整数相乘表示重复：<code>\"*\" * 5</code> 表示将 <code>*</code> 重复 5 次，结果是 <code>*****</code>。"
  },
  {
    id: 4,
    text: "获取画笔 <code>pen</code> 当前位置的方法是",
    options: ["A. <code>Pen.fillcolor()</code>", "B. <code>pen.pos()</code>", "C. <code>pen.home()</code>", "D. <code>pen.left()</code>"],
    answer: "B",
    explanation: "<code>pen.pos()</code> 返回画笔当前坐标。<code>pen.home()</code> 是让画笔回到原点，<code>pen.left()</code> 是左转，<code>fillcolor()</code> 是设置填充颜色。"
  },
  {
    id: 5,
    text: "画笔执行下列代码后，处于画板窗口的哪个位置<pre><code>pen.forward(100)\npen.right(90)\npen.forward(100)</code></pre>",
    options: ["A. 右上方", "B. 左上方", "C. 左下方", "D. 右下方"],
    answer: "D",
    explanation: "画笔初始在 (0,0)，向前100到右方 (100,0)，右转90度后面向下，再向前100到达 (100,-100)，即右下方。"
  },
  {
    id: 6,
    text: "下列哪一个可以设置画笔粗细",
    options: ["A. <code>p.pencolor(5)</code>", "B. <code>p.pensize(5)</code>", "C. <code>pensize(5)</code>", "D. <code>p.fillcolor(5)</code>"],
    answer: "B",
    explanation: "<code>pensize()</code> 用于设置画笔粗细。<code>pencolor()</code> 设置颜色，<code>fillcolor()</code> 设置填充颜色。注意需要以 <code>对象.方法()</code> 的形式调用。"
  },
  {
    id: 7,
    text: "以下哪一个指令可以画一个半圆弧",
    options: ["A. <code>p.circle(100)</code>", "B. <code>p.dot(100,180)</code>", "C. <code>p.circle(100,360)</code>", "D. <code>p.circle(100,180)</code>"],
    answer: "D",
    explanation: "<code>circle(半径, 角度)</code> 中第二个参数指定圆弧角度。180度即为半圆，360度是整圆（也是默认值）。"
  },
  {
    id: 8,
    text: "Python中查看数据类型的方式是",
    options: ["A. <code>type()</code>", "B. <code>range()</code>", "C. <code>forward()</code>", "D. <code>dot()</code>"],
    answer: "A",
    explanation: "<code>type()</code> 是 Python 内置函数，用于返回对象的数据类型。<code>range()</code> 生成整数序列，<code>forward()</code> 和 <code>dot()</code> 是 turtle 绘图函数。"
  },
  {
    id: 9,
    text: '变量 <code>a = "123"</code>，<code>b = 123</code>，<code>c = 123.0</code>，变量 a、b、c 的数据类型分别是',
    options: ["A. <code>int, str, float</code>", "B. <code>str, float, int</code>", "C. <code>list, int, str</code>", "D. <code>str, int, float</code>"],
    answer: "D",
    explanation: "带引号的是字符串(str)，纯数字是整数(int)，带小数点的是浮点数(float)。所以 a 是 str，b 是 int，c 是 float。"
  },
  {
    id: 10,
    text: "<code>for i in range(5):</code> 中 <code>i</code> 的取值范围是",
    options: ["A. 0到4", "B. 1到4", "C. 0到3", "D. 1到5"],
    answer: "A",
    explanation: "<code>range(5)</code> 生成 0、1、2、3、4 共 5 个数。记住规则：从 0 开始，到 n-1 结束，左闭右开。"
  },
  {
    id: 11,
    text: "画笔在画板上的初始位置是",
    options: ["A. (100,100)", "B. (0,100)", "C. (0,0)", "D. (100,0)"],
    answer: "C",
    explanation: "turtle 画板的坐标原点 (0,0) 在画布正中央，画笔默认初始位置就在原点。"
  },
  {
    id: 12,
    text: "多边形的外角和是多少度",
    options: ["A. 240度", "B. 180度", "C. 360度", "D. 120度"],
    answer: "C",
    explanation: "任意凸多边形的外角和恒等于 360 度，与边数无关。这是一个数学定理，turtle 画多边形时就用到了这个原理。"
  },
  {
    id: 13,
    text: "正九边形的每个外角是多少度",
    options: ["A. 9度", "B. 360/7度", "C. 360/9度", "D. 90度"],
    answer: "C",
    explanation: "外角和为 360 度，正九边形每个外角相等，所以每个外角 = 360 ÷ 9 = 40 度。"
  },
  {
    id: 14,
    text: "下列变量的命名正确的是",
    options: ["A. <code>a@123</code>", "B. <code>3ab</code>", "C. <code>_name</code>", "D. <code>sc hool</code>"],
    answer: "C",
    explanation: "Python 变量名只能包含字母、数字和下划线，不能以数字开头，不能含特殊符号和空格。A 含 @，B 以数字开头，D 含空格，只有 C 符合规则。"
  },
  {
    id: 15,
    text: "使用以下哪个符号可以将两个字符串拼接在一起",
    options: ["A. -", "B. +", "C. *", "D. %"],
    answer: "B",
    explanation: "Python 中用 <code>+</code> 连接字符串，如 <code>\"Hello\" + \"World\"</code> 得到 <code>\"HelloWorld\"</code>。<code>*</code> 是重复，<code>%</code> 是格式化。"
  },
  {
    id: 16,
    text: "拼接符号只能用于哪种类型的数据之间的拼接",
    options: ["A. 整数类型", "B. 小数类型", "C. 列表类型", "D. 字符串类型"],
    answer: "D",
    explanation: "<code>+</code> 用于字符串拼接时，两边都必须是字符串类型。不同类型（如字符串+整数）会引起 TypeError。"
  },
  {
    id: 17,
    text: "python中的输出方式是",
    options: ["A. <code>print()</code> 方法", "B. <code>python()</code> 方法", "C. <code>input()</code> 方法", "D. <code>turtle()</code> 方法"],
    answer: "A",
    explanation: "Python 使用内置函数 <code>print()</code> 向控制台输出内容。<code>input()</code> 是输入函数。"
  },
  {
    id: 18,
    text: "变化画笔颜色使用的方法是",
    options: ["A. <code>p.pencolour()</code>", "B. <code>p.pencolar()</code>", "C. <code>p.pencolor()</code>", "D. <code>p.penColor()</code>"],
    answer: "C",
    explanation: "正确拼写是 <code>pencolor()</code>（美式拼写 color）。A 用的是英式拼写 colour，B 和 D 拼写错误。"
  },
  {
    id: 19,
    text: "重置画笔的方式是",
    options: ["A. <code>reset()</code> 方法", "B. <code>rest()</code> 方法", "C. <code>ret()</code> 方法", "D. <code>replay()</code> 方法"],
    answer: "A",
    explanation: "<code>reset()</code> 会清空画布并将画笔恢复到初始状态（位置归零、方向朝右、颜色默认）。B/C/D 都不是 turtle 的有效方法。"
  },
  {
    id: 20,
    text: "<code>pen.circle(50)</code> 中 <code>50</code> 代表圆的",
    options: ["A. 直径", "B. 面积", "C. 周长", "D. 半径"],
    answer: "D",
    explanation: "<code>circle()</code> 的第一个参数是圆的半径。所以 <code>circle(50)</code> 画的是半径为 50 像素的圆。"
  }
];

// ==================== 渲染题目 ====================
function renderQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  questions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = `q-block-${q.id}`;

    const optionsHtml = q.options.map((opt, i) => {
      const letter = ['A','B','C','D'][i];
      return `
        <label class="option-label" id="opt-${q.id}-${letter}">
          <input type="radio" name="q${q.id}" value="${letter}" onchange="onOptionChange(${q.id})">
          ${opt}
        </label>`;
    }).join('');

    block.innerHTML = `
      <div class="question-title">
        <span class="q-num">${q.id}</span>
        <span>${q.text}（&nbsp;&nbsp;&nbsp;&nbsp;）</span>
      </div>
      <div class="options">${optionsHtml}</div>
      <div class="answer-hint" id="hint-${q.id}"></div>
    `;
    container.appendChild(block);
  });

  updateProgress();
}

// ==================== 进度更新 ====================
function onOptionChange(qId) {
  updateProgress();
}

function countAnswered() {
  return questions.filter(q => {
    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
    return sel !== null;
  }).length;
}

function updateProgress() {
  const done = countAnswered();
  const total = questions.length;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(done / total * 100).toFixed(1)}%`;
}

// ==================== 提交 ====================
function submitQuiz() {
  const answered = countAnswered();
  const total = questions.length;

  if (answered < total) {
    const warn = document.getElementById('warn-msg');
    warn.classList.add('show');
    warn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  document.getElementById('warn-msg').classList.remove('show');

  let correct = 0;
  const details = [];

  questions.forEach(q => {
    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
    const userAns = sel ? sel.value : null;
    const isCorrect = userAns === q.answer;
    if (isCorrect) correct++;
    details.push({ q, userAns, isCorrect });
  });

  const score = Math.round(correct / total * 100);

  // 显示成绩
  showResult(score, correct, total - correct, details);
}

// ==================== 显示成绩 ====================
function showResult(score, correctCount, wrongCount, details) {
  document.getElementById('quiz-section').style.display = 'none';
  const resultSec = document.getElementById('result-section');
  resultSec.style.display = 'block';

  // 分数圆
  document.getElementById('score-number').textContent = score;
  document.getElementById('score-circle').style.setProperty('--pct', `${score}%`);

  // 评语
  let title, desc;
  if (score === 100) {
    title = '🎉 满分！太厉害了！';
    desc = '你完全掌握了这些Python知识，继续保持！';
  } else if (score >= 85) {
    title = '🌟 非常棒！';
    desc = '答题很不错，还有一点小错误，再复习一下吧！';
  } else if (score >= 70) {
    title = '👍 良好！';
    desc = '基础掌握得不错，继续努力！';
  } else if (score >= 60) {
    title = '😊 还不错，继续加油！';
    desc = '刚刚过关，多练习巩固一下吧！';
  } else {
    title = '💪 加油！继续努力！';
    desc = '还需要多复习Python知识哦，不要气馁！';
  }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-desc').textContent = desc;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = wrongCount;

  // 答题详情
  renderReview(details);

  resultSec.scrollIntoView({ behavior: 'smooth' });
}

function renderReview(details) {
  const container = document.getElementById('review-container');
  container.innerHTML = '';

  const hasWrong = details.some(d => !d.isCorrect);

  details.forEach(({ q, userAns, isCorrect }) => {
    const block = document.createElement('div');
    block.className = 'question-block';

    const optionsHtml = q.options.map((opt, i) => {
      const letter = ['A','B','C','D'][i];
      // 默认不显示正确答案高亮，只标记用户选错的
      let cls = '';
      if (letter === userAns && !isCorrect) cls = 'wrong';
      // 正确答案用标记存下来，点按钮后才显示
      return `<div class="option-label ${cls}" data-is-answer="${letter === q.answer ? '1' : '0'}">${opt}${letter === userAns && !isCorrect ? ' ✗' : ''}</div>`;
    }).join('');

    const hintHtml = isCorrect
      ? `<div class="answer-hint ok" data-correct-hint="true" style="display:none">✅ 回答正确！<div class="explanation">💡 <b>解析：</b>${q.explanation}</div></div>`
      : `<div class="answer-hint err" data-wrong-hint="true" style="display:none">❌ 你的答案是 <b>${userAns}</b>，正确答案是 <b>${q.answer}</b><div class="explanation">💡 <b>解析：</b>${q.explanation}</div></div>`;

    block.innerHTML = `
      <div class="question-title">
        <span class="q-num" style="background:${isCorrect ? '#28a745' : '#dc3545'}">${q.id}</span>
        <span>${q.text}</span>
      </div>
      <div class="options">${optionsHtml}</div>
      ${hintHtml}
    `;
    container.appendChild(block);
  });

  // 控制按钮显示
  const btnShowAnswers = document.getElementById('btn-show-answers');
  const btnShowAll = document.getElementById('btn-show-all');
  if (hasWrong) {
    btnShowAnswers.classList.remove('hidden');
    btnShowAll.classList.remove('hidden');
  } else {
    btnShowAnswers.classList.add('hidden');
    btnShowAll.classList.remove('hidden');
  }
}

function showWrongAnswers() {
  document.querySelectorAll('#review-container .option-label[data-is-answer="1"]').forEach(el => {
    el.classList.add('correct-hint');
  });
  document.querySelectorAll('#review-container .answer-hint[data-wrong-hint]').forEach(el => {
    el.style.display = 'block';
  });
  document.getElementById('btn-show-answers').classList.add('hidden');
}

function showAllAnswers() {
  // 显示全部正确答案高亮和提示
  document.querySelectorAll('#review-container .option-label[data-is-answer="1"]').forEach(el => {
    el.classList.add('correct-hint');
  });
  document.querySelectorAll('#review-container .answer-hint[data-wrong-hint]').forEach(el => {
    el.style.display = 'block';
  });
  document.querySelectorAll('#review-container .answer-hint[data-correct-hint]').forEach(el => {
    el.style.display = 'block';
  });
  document.getElementById('btn-show-answers').classList.add('hidden');
  document.getElementById('btn-show-all').classList.add('hidden');
}

// ==================== 重新答题 ====================
function retryQuiz() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  document.getElementById('btn-show-answers').classList.add('hidden');
  document.getElementById('btn-show-all').classList.add('hidden');
  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==================== 初始化 ====================
renderQuestions();
</script>
